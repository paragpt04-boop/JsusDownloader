name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Keystore propio (opcional, desde Secrets)
        env:
          KS_B64: ${{ secrets.JSUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/jsus.keystore"
            echo "JSUS_KEYSTORE_FILE=$RUNNER_TEMP/jsus.keystore" >> "$GITHUB_ENV"
            echo "Usando keystore propio"
          else
            echo "Usando keystore de desarrollo del repo"
          fi

      - name: Compilar APK
        env:
          JSUS_KEYSTORE_PASSWORD: ${{ secrets.JSUS_KEYSTORE_PASSWORD }}
          JSUS_KEY_ALIAS: ${{ secrets.JSUS_KEY_ALIAS }}
          JSUS_KEY_PASSWORD: ${{ secrets.JSUS_KEY_PASSWORD }}
        run: |
          # Variables vacías = usar las de desarrollo
          [ -z "$JSUS_KEYSTORE_PASSWORD" ] && unset JSUS_KEYSTORE_PASSWORD
          [ -z "$JSUS_KEY_ALIAS" ] && unset JSUS_KEY_ALIAS
          [ -z "$JSUS_KEY_PASSWORD" ] && unset JSUS_KEY_PASSWORD
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not (find|resolve)|FAILURE" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
          tail -80 build.log

      - name: Renombrar APKs
        run: |
          mkdir -p out
          V="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/JsusDownloader-v1.0.$V-arm64.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "out/JsusDownloader-v1.0.$V-armv7.apk"
          ls -la out

      - name: Subir APK (arm64 - celulares modernos)
        uses: actions/upload-artifact@v4
        with:
          name: JsusDownloader-arm64
          path: out/*-arm64.apk

      - name: Subir APK (armv7 - celulares viejos)
        uses: actions/upload-artifact@v4
        with:
          name: JsusDownloader-armv7
          path: out/*-armv7.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JSUS Downloader v1.0.${{ github.run_number }}
          body: |
            APK compilado automáticamente.
            - **arm64**: la mayoría de celulares (2017 en adelante) ← usa este
            - **armv7**: celulares viejos de 32 bits
          files: out/*.apk
          make_latest: true
